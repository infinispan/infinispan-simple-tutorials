# tag::config[]
infinispan.remote.connection-uri=hotrod://admin:password@127.0.0.1:11222

# Inline cache configuration (classpath: URIs are not supported in native images)
infinispan.remote.cache.characters.configuration=<distributed-cache statistics="true"><encoding><key media-type="application/x-protostream"/><value media-type="application/x-protostream"/></encoding><indexing enabled="true"><indexed-entities><indexed-entity>tutorial.Character</indexed-entity></indexed-entities></indexing></distributed-cache>
infinispan.remote.cache.characters.marshaller=org.infinispan.commons.marshall.ProtoStreamMarshaller

characters.filename=characters.csv

# Protobuf schemas are automatically discovered and uploaded to the server at startup.
# To disable this behavior, uncomment the following property:
# infinispan.remote.use-schema-registration=false
# end::config[]
